name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Frontend → Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: frontend

  deploy-backend:
    name: Backend → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping backend deploy"
            exit 0
          fi
          # Print the service ID portion only (not the key) for debugging
          echo "Triggering deploy for: $(echo "$RENDER_URL" | grep -oP 'srv-[^?]+')"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "Deploy triggered successfully"
          else
            echo "::warning::Render deploy hook returned $HTTP_STATUS — check that the service exists and RENDER_DEPLOY_HOOK_URL is current in repo secrets"
            exit 0
          fi
